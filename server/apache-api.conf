# Apache reverse-proxy vhost for the lpic-sync API.
# Install: copy to /etc/apache2/sites-available/, a2ensite, reload.
# Then: certbot --apache -d api.isayenko.org  (adds the :443 vhost + redirect).
<VirtualHost *:80>
    ServerName api.isayenko.org

    # Let certbot's HTTP-01 challenge be served locally, proxy everything else.
    ProxyPass        /.well-known !
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
