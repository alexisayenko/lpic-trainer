# Apache vhosts for the lpic-sync API.
# Install: copy to /etc/apache2/sites-available/, a2ensite, reload.
# Then: certbot certonly --apache -d api.isayenko.org && systemctl reload apache2
# — the :443 vhost below activates once the cert files exist.

# :80 serves only certbot's HTTP-01 challenge; everything else redirects to https.
<VirtualHost *:80>
    ServerName api.isayenko.org

    RedirectMatch 308 "^/(?!\.well-known/acme-challenge/)(.*)" "https://api.isayenko.org/$1"
</VirtualHost>

<IfFile /etc/letsencrypt/live/api.isayenko.org/fullchain.pem>
<VirtualHost *:443>
    ServerName api.isayenko.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.isayenko.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.isayenko.org/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
</VirtualHost>
</IfFile>
